name: Native signed release candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Release candidate platform
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      version_name:
        description: Marketing version, for example 1.0.0
        required: true
        default: 1.0.0
        type: string
      build_number:
        description: Positive integer shared by Android and iOS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-signed-release
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android App Bundle
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    environment: native-release
    env:
      HOMEVAULT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      HOMEVAULT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      HOMEVAULT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Validate release inputs and Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ "${{ inputs.version_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${{ inputs.build_number }}" =~ ^[1-9][0-9]*$ ]]
          test -n "$KEYSTORE_BASE64"
          test -n "$HOMEVAULT_ANDROID_KEYSTORE_PASSWORD"
          test -n "$HOMEVAULT_ANDROID_KEY_ALIAS"
          test -n "$HOMEVAULT_ANDROID_KEY_PASSWORD"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync android
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homevault-release.jks"
          chmod 600 "$RUNNER_TEMP/homevault-release.jks"
          echo "HOMEVAULT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/homevault-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release bundle
        working-directory: android
        run: ./gradlew bundleRelease -PversionCode=${{ inputs.build_number }} -PversionName=${{ inputs.version_name }}
      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: homevault-android-${{ inputs.version_name }}-${{ inputs.build_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Signed iOS archive
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    environment: native-release
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release inputs and Apple signing secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          [[ "${{ inputs.version_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${{ inputs.build_number }}" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_BASE64"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync ios
      - name: Install temporary Apple signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/homevault-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/homevault.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/homevault-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "HOMEVAULT_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "HOMEVAULT_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "HOMEVAULT_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Archive signed iOS candidate
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HomeVault.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$HOMEVAULT_PROFILE_NAME" \
            MARKETING_VERSION="${{ inputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}"
      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>au.com.homevault.app</key>
              <string>$HOMEVAULT_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HomeVault.xcarchive" \
            -exportPath "$RUNNER_TEMP/HomeVaultExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: homevault-ios-${{ inputs.version_name }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/HomeVaultExport/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "$HOMEVAULT_PROFILE_UUID" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$HOMEVAULT_PROFILE_UUID.mobileprovision"
          fi
          if [ -n "$HOMEVAULT_KEYCHAIN_PATH" ]; then
            security delete-keychain "$HOMEVAULT_KEYCHAIN_PATH" || true
          fi
