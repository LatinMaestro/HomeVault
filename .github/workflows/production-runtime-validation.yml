name: Production runtime validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VALIDATE_PRODUCTION to run the disposable account check
        required: true
        type: string
  push:
    branches:
      - ops/production-runtime-validation

concurrency:
  group: homevault-production-runtime-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate live production services
    if: github.event_name == 'push' || inputs.confirmation == 'VALIDATE_PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.HOMEVAULT_PRODUCTION_DATABASE_URL }}
      PRODUCTION_ORIGIN: https://homevault.grovekind.com
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production runtime
        run: node scripts/validate-production-runtime.mjs
