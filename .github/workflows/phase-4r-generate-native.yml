name: Generate native platform projects

on:
  push:
    branches:
      - agent/phase-4r-native-platform-foundation
    paths:
      - .github/workflows/phase-4r-generate-native.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase-4r-native-platform-foundation
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Add native dependencies
        run: |
          pnpm add @capacitor/core @capacitor/app @capacitor/network @capacitor/status-bar
          pnpm add --save-dev @capacitor/cli @capacitor/ios @capacitor/android @capacitor/assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "Add Capacitor dependencies"
          git push
      - name: Generate native projects
        run: |
          pnpm exec cap add ios
          pnpm exec cap add android
          git add ios android
          git commit -m "Generate iOS and Android projects"
          git push
      - name: Generate branded assets
        run: |
          mkdir -p assets
          cp public/icons/homevault.svg assets/logo.svg
          pnpm exec capacitor-assets generate --iconBackgroundColor '#0f766e' --iconBackgroundColorDark '#0f766e' --splashBackgroundColor '#f8faf9' --splashBackgroundColorDark '#102f2b'
          pnpm exec cap sync
          git add assets ios android
          git commit -m "Generate branded native assets"
          git push
