name: Add native privacy plugin

on:
  push:
    branches:
      - agent/phase-4s-native-privacy-links
    paths:
      - .github/workflows/phase-4s-add-privacy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase-4s-native-privacy-links
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm add @capacitor/privacy-screen
      - run: pnpm exec cap sync
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml ios android
          git commit -m "Add native privacy screen"
          git push
