name: Add Vercel Blob dependency

on:
  push:
    branches:
      - agent/phase-4p-private-attachments
    paths:
      - .github/workflows/phase-4p-add-blob.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase-4p-private-attachments
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm add @vercel/blob
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "Add Vercel Blob SDK"
          git push
