name: Phase 4F dependency lock

on:
  push:
    branches:
      - agent/phase-4f-auth-foundation
    paths:
      - .github/workflows/phase-4f-dependency-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase-4f-auth-foundation
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm add --save-exact better-auth @better-auth/prisma-adapter
      - name: Commit dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: add Better Auth dependencies"
          git push origin HEAD:agent/phase-4f-auth-foundation
