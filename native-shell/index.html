<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>HomeVault</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8faf9; color: #18312e; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; }
      main { width: min(100%, 420px); }
      .mark { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 8px; background: #0f766e; color: white; font-weight: 700; font-size: 24px; }
      h1 { margin: 24px 0 8px; font-size: 30px; }
      p { margin: 0; color: #526764; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">H</div>
      <h1>HomeVault</h1>
      <p>Connect to the internet to securely open your household records.</p>
    </main>
  </body>
</html>
